name: Release AppImage

# Push a tag like v0.2.0 (or run manually) to build the AppImage on GitHub
# and publish it in the Releases section.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libxdo-dev \
            libfuse2

      - run: npm ci

      - name: Type-check frontend and Rust
        run: |
          npx tsc --noEmit
          node scripts/stage-phpmyadmin.mjs
          cargo check --manifest-path src-tauri/Cargo.toml --lib

      - name: Build AppImage
        run: npm run build:release

      - name: Collect artifact
        id: artifact
        run: |
          set -euo pipefail
          file=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          chmod +x "$file"
          sha256sum "$file" > "$file.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          file="${{ steps.artifact.outputs.file }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$file" "$file.sha256" --clobber
          else
            gh release create "$TAG" "$file" "$file.sha256" \
              --target "${{ github.sha }}" \
              --title "LinuxDevStackBox $TAG" \
              --generate-notes \
              --notes "Linux AppImage build. Requires system Apache, MariaDB/MySQL and php-cgi (see README). Run: chmod +x LinuxDevStackBox*.AppImage && ./LinuxDevStackBox*.AppImage"
          fi
