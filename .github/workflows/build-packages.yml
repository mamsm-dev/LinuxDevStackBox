name: Build Linux packages

# Builds the Linux packages (Arch, Debian, Fedora, AppImage) in
# distribution-appropriate environments. Invoked by release.yml on version
# tags; also runnable manually for testing.
#
# NOTE: this workflow NEVER publishes a release. It only uploads build
# artifacts. GitHub Releases are created exclusively by release.yml in
# response to a v* tag push.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_NAME: linuxdevstackbox

jobs:
  appimage:
    name: AppImage bundle (.AppImage)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri AppImage build dependencies
        run: |
          sudo apt-get update
          # build-essential: the C toolchain used by cc-based Rust crates.
          # The GTK/WebKitGTK/librsvg -dev packages: Tauri Linux build and
          # AppImage bundling. patchelf: required by the AppImage bundler.
          sudo apt-get install -y \
            build-essential libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file
          # The Tauri AppImage bundler runs linuxdeploy with
          # APPIMAGE_EXTRACT_AND_RUN=1, which does not need FUSE, but a
          # FUSE library is kept available for AppImage tooling variants.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true
      - name: Verify packaging metadata consistency
        run: node scripts/verify-packaging-metadata.mjs
      - name: Install frontend dependencies (provides @tauri-apps/cli)
        run: npm ci
      - name: Confirm the Tauri CLI is resolvable
        run: npm run tauri -- --version
      - name: Seed an up-to-date linuxdeploy
        run: |
          # The linuxdeploy build pinned by the Tauri CLI ships binutils too
          # old to strip libraries using DT_RELR relocations (.relr.dyn),
          # which current distribution libraries use. The Tauri CLI only
          # downloads linuxdeploy when it is not in its cache, so pre-seed
          # the cache with the upstream continuous build, whose strip
          # handles DT_RELR. Verified locally: with the pinned build the
          # bundling fails on libyuv/libzstd; with this one it succeeds.
          mkdir -p "$HOME/.cache/tauri"
          curl -sL -o "$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x "$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage"
      - name: Build the AppImage
        run: npm run tauri -- build --bundles appimage
        env:
          # linuxdeploy is itself an AppImage; extraction-and-run mode lets
          # it execute without FUSE (which CI runners do not provide).
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Validate the built AppImage
        run: |
          pkg="$(ls src-tauri/target/release/bundle/appimage/*.AppImage)"
          echo "Built: $pkg"
          file "$pkg" | grep -q 'ELF 64-bit'
          test "$(du -sm "$pkg" | cut -f1)" -gt 20  # a real bundle, not a stub
      - name: Upload the AppImage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appimage-package
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  notice:
    name: Publication notice
    runs-on: ubuntu-latest
    steps:
      - name: Explain what this run publishes
        run: |
          echo "This workflow only uploads build artifacts."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "This was a manual run: NO GitHub Release is created."
            echo "To publish a release, push a version tag:"
            echo "  git tag v<version> && git push origin v<version>"
          else
            echo "Called by release.yml for tag ${{ github.ref_name }};"
            echo "release.yml will publish once every build job succeeds."
          fi

  arch:
    name: Arch Linux package (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build and runtime dependencies
        run: |
          # Initialize the package database, then install the PKGBUILD's
          # makedepends AND its runtime dependencies: makepkg resolves the
          # full dependency graph before building, and the app's runtime
          # stack (apache, mariadb, php, php-cgi, openssl) is declared via
          # real package names verified against the official repositories.
          pacman -Syu --noconfirm \
            git nodejs npm rust webkit2gtk-4.1 \
            apache mariadb mariadb-clients php php-cgi openssl
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Mark the workspace as a safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify packaging metadata consistency
        run: node scripts/verify-packaging-metadata.mjs
      - name: Create the source tarball for makepkg
        run: |
          version="$(sed -n 's/^pkgver=\(.*\)$/\1/p' packaging/arch/PKGBUILD)"
          git archive --prefix="${PACKAGE_NAME}/" \
            -o "packaging/arch/${PACKAGE_NAME}-${version}.tar.gz" HEAD
      - name: Build the package as a non-root user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # makepkg refuses to run as root; give the builder account
          # passwordless access to pacman only, so --syncdeps can verify
          # and install the declared dependency set itself.
          echo 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman' > /etc/sudoers.d/builder-pacman
          chmod 440 /etc/sudoers.d/builder-pacman
          su builder -c "cd packaging/arch && makepkg --syncdeps --noconfirm"
      - name: Validate the built package
        run: |
          pkg="$(ls packaging/arch/*.pkg.tar.zst)"
          pacman -Qip "$pkg"
          # Capture the listing once: piping long listings into "grep -q"
          # lets the early-exiting grep SIGPIPE-kill the producer (observed
          # as "tar: stdout: write error" in the Debian job).
          pacman -Qlp "$pkg" > /tmp/pkg-contents.txt
          grep -E 'usr/bin/linuxdevstackbox$' /tmp/pkg-contents.txt
          grep -qE 'usr/lib/linuxdevstackbox/phpmyadmin/index\.php$' /tmp/pkg-contents.txt
          grep -qE 'usr/share/applications/com\.mam\.linuxdevstackbox\.desktop$' /tmp/pkg-contents.txt
      - name: Upload the Arch package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  deb:
    name: Debian package (.deb)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install the build dependencies declared in debian/control
        run: |
          sudo apt-get update
          # Everything in Build-Depends must be installable as a Debian
          # package; dpkg-checkbuilddeps (run by dpkg-buildpackage) checks
          # package metadata, not what is on PATH. Node.js >= 20 and Rust
          # >= 1.77.2 come from setup-node/rustup instead - see
          # packaging/debian/README.source for why they are not declared.
          sudo apt-get install -y \
            build-essential pkg-config git libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf debhelper dpkg-dev lintian
      - name: Confirm dpkg-checkbuilddeps passes
        run: |
          cp -a packaging/debian ./debian
          dpkg-checkbuilddeps
          rm -rf debian
      - name: Verify packaging metadata consistency
        run: node scripts/verify-packaging-metadata.mjs
      - name: Stage the Debian packaging directory
        run: rm -rf debian && cp -a packaging/debian ./debian
      - name: Build the Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          mv "${GITHUB_WORKSPACE}"/../*.deb .
          mv "${GITHUB_WORKSPACE}"/../*.buildinfo . 2>/dev/null || true
          mv "${GITHUB_WORKSPACE}"/../*.changes . 2>/dev/null || true
      - name: Validate the built package
        run: |
          pkg="$(ls linuxdevstackbox_*.deb)"
          dpkg-deb --info "$pkg"
          # Capture the listing once: "dpkg-deb --contents | grep -q"
          # SIGPIPE-kills dpkg-deb's internal tar ("tar: stdout: write
          # error", "tar subprocess returned error exit status 2").
          dpkg-deb --contents "$pkg" > /tmp/deb-contents.txt
          grep -E 'usr/bin/linuxdevstackbox$' /tmp/deb-contents.txt
          grep -qE 'usr/lib/linuxdevstackbox/phpmyadmin/index\.php$' /tmp/deb-contents.txt
          grep -qE 'usr/share/applications/com\.mam\.linuxdevstackbox\.desktop$' /tmp/deb-contents.txt
          lintian --fail-on error "$pkg"
      - name: Upload the Debian package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-package
          path: linuxdevstackbox_*.deb
          if-no-files-found: error

  rpm:
    name: Fedora package (.rpm)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y git nodejs npm rust cargo gcc gcc-c++ make pkgconfig \
            openssl-devel gtk3-devel webkit2gtk4.1-devel librsvg2-devel \
            libayatana-appindicator-gtk3-devel rpm-build
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Mark the workspace as a safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify packaging metadata consistency
        run: node scripts/verify-packaging-metadata.mjs
      - name: Create the source tarball for rpmbuild
        run: |
          version="$(sed -n 's/^Version:[[:space:]]*\([0-9.]*\).*/\1/p' packaging/fedora/linuxdevstackbox.spec | tr -d '[:space:]')"
          git archive --prefix="${PACKAGE_NAME}-${version}/" \
            -o "${PACKAGE_NAME}-${version}.tar.gz" HEAD
      - name: Build the RPM package
        run: |
          rpmbuild -bb \
            --define "_sourcedir $PWD" \
            --define "_rpmdir $PWD/dist" \
            --define "_srcrpmdir $PWD/dist" \
            packaging/fedora/linuxdevstackbox.spec
      - name: Validate the built package
        run: |
          # rpmbuild appends only the arch directory under _rpmdir, so the
          # real output lives at dist/x86_64/ (not dist/RPMS/x86_64/).
          # Discover the application RPM instead of hardcoding a directory,
          # excluding source and debuginfo RPMs, and fail clearly if the
          # build did not produce exactly one.
          pkg="$(find dist -type f -name "${PACKAGE_NAME}-*.x86_64.rpm" ! -name "*debuginfo*" | head -1)"
          if [ -z "$pkg" ]; then
            echo "ERROR: no application RPM was produced under dist/. Contents:" >&2
            find dist -type f >&2 || true
            exit 1
          fi
          echo "Validating: $pkg"
          rpm -qip "$pkg"
          rpm -qpl "$pkg" > /tmp/rpm-contents.txt
          grep -E 'usr/bin/linuxdevstackbox$' /tmp/rpm-contents.txt
          grep -qE 'usr/lib/linuxdevstackbox/phpmyadmin/index\.php$' /tmp/rpm-contents.txt
          grep -qE 'usr/share/applications/com\.mam\.linuxdevstackbox\.desktop$' /tmp/rpm-contents.txt
          test "$(find dist -type f -name "${PACKAGE_NAME}-*.x86_64.rpm" ! -name "*debuginfo*" | wc -l)" -eq 1
          # The binary must be x86_64 and the package must declare its deps.
          rpm -qp --qf '%{ARCH}\n' "$pkg" > /tmp/rpm-arch.txt
          grep -qx x86_64 /tmp/rpm-arch.txt
          rpm -qp --requires "$pkg" > /tmp/rpm-requires.txt
          grep -q httpd /tmp/rpm-requires.txt
      - name: Upload the Fedora package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpm-package
          path: dist/*/${PACKAGE_NAME}-*.x86_64.rpm
          if-no-files-found: error
